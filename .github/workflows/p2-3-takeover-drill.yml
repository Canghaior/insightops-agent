name: P2.3-C production takeover drill

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type P2.3-C-TAKEOVER-DRILL to authorize one guarded Server SIGKILL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: insightops-production
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Validate confirmation and production secrets
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test "$CONFIRMATION" = "P2.3-C-TAKEOVER-DRILL"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Create test Run and execute guarded takeover
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DRILL_MARKER: P23-TAKEOVER-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          printf -v remote_command \
            'cd %q && git fetch origin main && git checkout main && git pull --ff-only origin main && bash scripts/p2-3-production-takeover-acceptance.sh %q --confirm-production-restart' \
            "$DEPLOY_PATH" "$DRILL_MARKER"
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_command"
