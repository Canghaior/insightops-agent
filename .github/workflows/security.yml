name: Security gates

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

jobs:
  codeql:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          license-check: true
          deny-licenses: AGPL-1.0-or-later, GPL-3.0-or-later

  secrets-and-filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan source, configuration and dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-source.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload Trivy findings
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-source.sarif
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.20.6
        with:
          path: .
          format: cyclonedx-json
          output-file: insightops-sbom.cdx.json
          artifact-name: insightops-sbom-${{ github.sha }}

  production-images:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [server, worker, web]
    steps:
      - name: Scan published production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/canghaior/insightops-agent-${{ matrix.image }}:latest
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
