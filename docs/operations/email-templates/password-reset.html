<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>重置您的 InsightOps Agent 密码</title>
</head>
<body style="margin:0;padding:0;background:#f4f7f6;color:#17211f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f4f7f6;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;background:#ffffff;border:1px solid #dfe8e5;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="padding:24px 32px;background:#10211e;color:#71dfc0;font-size:20px;font-weight:700;">
              InsightOps Agent
            </td>
          </tr>
          <tr>
            <td style="padding:36px 32px;">
              <h1 style="margin:0 0 20px;font-size:26px;line-height:1.35;color:#17211f;">重置您的密码</h1>
              <p style="margin:0 0 24px;font-size:16px;line-height:1.8;color:#465551;">
                我们收到了 InsightOps Agent 账户的密码重置请求。请点击下面的按钮设置新密码。
              </p>
              <p style="margin:0 0 28px;">
                <a href="{{link}}" style="display:inline-block;padding:13px 24px;border-radius:8px;background:#22a884;color:#ffffff;text-decoration:none;font-size:16px;font-weight:700;">重置密码</a>
              </p>
              <p style="margin:0 0 10px;font-size:14px;line-height:1.7;color:#64736f;">
                按钮无法打开时，请复制下面的链接到浏览器：
              </p>
              <p style="margin:0 0 24px;font-size:13px;line-height:1.7;word-break:break-all;color:#267c68;">{{link}}</p>
              <p style="margin:0;font-size:14px;line-height:1.7;color:#64736f;">
                链接将在 30 分钟后失效，且只能使用一次。如果这不是您的操作，请忽略本邮件；您的原密码不会改变。
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;background:#f7faf9;border-top:1px solid #e6eeeb;font-size:12px;line-height:1.7;color:#7b8985;">
              本邮件由 InsightOps Agent 自动发送，请勿直接回复。
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
