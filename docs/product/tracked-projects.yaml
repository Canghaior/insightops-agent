        trustTier: "T1_OFFICIAL_REPOSITORY"
        updateFrequency: "持续更新"
        collectionEnabled: false
        verification: { status: "VERIFIED", checkedAt: "2026-08-16" }
      - id: "dify-github-release"
        type: "github_release"
        name: "Dify GitHub Releases"
        url: "https://github.com/langgenius/dify/releases"
        apiUrl: "https://api.github.com/repos/langgenius/dify/releases"
        trustTier: "T1_OFFICIAL_REPOSITORY"
        updateFrequency: "版本发布时更新"
        collectionEnabled: true
        verification: { status: "VERIFIED", checkedAt: "2026-08-16" }
      - id: "dify-documentation"
        type: "official_documentation"
        name: "Dify Documentation"
        url: "https://docs.dify.ai/"
        trustTier: "T1_PROJECT_DOMAIN"
        updateFrequency: "随产品和文档修订持续更新"
        collectionEnabled: false
        verification: { status: "VERIFIED", checkedAt: "2026-08-16" }
      - id: "dify-blog"
        type: "official_blog"
