name: ${COMPOSE_PROJECT_NAME:-insightops-prod}

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: prod
  DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/insightops}
  DB_USERNAME: ${DB_USERNAME:-insightops}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_ENABLED: ${DEEPSEEK_ENABLED:-false}
  SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-none}
  DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-v4-flash}
  DEEPSEEK_THINKING_ENABLED: ${DEEPSEEK_THINKING_ENABLED:-false}
  MODEL_MONTHLY_BUDGET_CNY: ${MODEL_MONTHLY_BUDGET_CNY:-20}
  EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
  SPRING_AI_MODEL_EMBEDDING: ${SPRING_AI_MODEL_EMBEDDING:-ollama}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://ollama:11434}
  RAG_ENABLED: ${RAG_ENABLED:-true}

x-logging: &app-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insightops}
      POSTGRES_USER: ${POSTGRES_USER:-insightops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backend]
    logging: *app-logging

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [backend]
    logging: *app-logging

  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $${EMBEDDING_MODEL:-bge-m3}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks: [backend]

  server:
    image: ghcr.io/canghaior/insightops-agent-server:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: insightops-server/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 18080
      AUTH_BOOTSTRAP_ENABLED: ${AUTH_BOOTSTRAP_ENABLED:-false}
      AUTH_BOOTSTRAP_USERNAME: ${AUTH_BOOTSTRAP_USERNAME:-alpha-owner}
      AUTH_BOOTSTRAP_DISPLAY_NAME: ${AUTH_BOOTSTRAP_DISPLAY_NAME:-Alpha Owner}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-14}
      AUTH_SECURE_COOKIE: ${AUTH_SECURE_COOKIE:-true}
      AUTH_LOGIN_MAX_FAILURES: ${AUTH_LOGIN_MAX_FAILURES:-5}
      AUTH_LOGIN_WINDOW_MINUTES: ${AUTH_LOGIN_WINDOW_MINUTES:-15}
      AUTH_LOGIN_LOCK_MINUTES: ${AUTH_LOGIN_LOCK_MINUTES:-15}
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks: [backend]
    logging: *app-logging
    deploy:
      resources:
        limits:
          memory: 3G

  worker:
    image: ghcr.io/canghaior/insightops-agent-worker:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: insightops-worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVER_ADDRESS: 0.0.0.0
      WORKER_PORT: 18081
      RELEASE_COLLECTION_ENABLED: ${RELEASE_COLLECTION_ENABLED:-true}
      INTELLIGENCE_ANALYSIS_ENABLED: ${INTELLIGENCE_ANALYSIS_ENABLED:-true}
      DOCUMENT_COLLECTION_ENABLED: ${DOCUMENT_COLLECTION_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks: [backend]
    logging: *app-logging
    deploy:
      resources:
        limits:
          memory: 4G

  web:
    image: ghcr.io/canghaior/insightops-agent-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: insightops-web/Dockerfile
    restart: unless-stopped
    networks: [backend]
    logging: *app-logging
    deploy:
      resources:
        limits:
          memory: 128M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_ADDRESS: ${APP_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2019/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]
    logging: *app-logging

  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      server:
        condition: service_healthy
      worker:
        condition: service_healthy
    networks: [backend]
    logging: *app-logging

  grafana:
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]
    networks: [backend]
    logging: *app-logging

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  ollama-data:
  caddy-data:
  caddy-config:
  caddy-logs:
  prometheus-data:
  grafana-data:
