services:
  server:
    environment:
      INSIGHTOPS_PUBLIC_BETA_ENABLED: ${PUBLIC_BETA_ENABLED:-false}
      INSIGHTOPS_PUBLIC_BETA_MAXIMUM_REGISTRATIONS: ${PUBLIC_BETA_MAXIMUM_REGISTRATIONS:-100}
      INSIGHTOPS_PUBLIC_BETA_MINIMUM_AGE: ${PUBLIC_BETA_MINIMUM_AGE:-14}
      INSIGHTOPS_PUBLIC_BETA_PENDING_VERIFICATION_HOURS: ${PUBLIC_BETA_PENDING_VERIFICATION_HOURS:-24}
