groups:
  - name: insightops-production
    rules:
      - alert: InsightOpsServiceDown
        expr: up{job=~"insightops-server|insightops-worker"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "InsightOps {{ $labels.job }} is unavailable"
      - alert: KnowledgeCollectionLeaseExpired
        expr: insightops_knowledge_collection_expired_leases > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "A knowledge collection worker lease has expired"
      - alert: KnowledgeEmbeddingBacklog
        expr: insightops_knowledge_embedding_backlog > 5000
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Knowledge embedding backlog exceeds 5,000 chunks"
      - alert: KnowledgeUploadFailures
        expr: insightops_knowledge_upload_failed > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "One or more uploaded knowledge files failed processing"
      - alert: InsightOpsHighHttpErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[10m])) / clamp_min(sum(rate(http_server_requests_seconds_count[10m])), 0.001) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "InsightOps HTTP 5xx rate is above 5%"
      - alert: AgentToolRetryRateHigh
        expr: sum(rate(insightops_agent_tool_retries_total[10m])) / clamp_min(sum(rate(insightops_agent_tool_attempts_total[10m])), 0.001) > 0.20
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Agent tool retry rate is above 20%"
      - alert: AgentToolTimeoutBurst
        expr: sum(increase(insightops_agent_tool_timeouts_total[10m])) > 5
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "More than five Agent tool timeouts occurred in ten minutes"
      - alert: AgentToolCircuitOpen
        expr: max(insightops_agent_tool_circuit_state) >= 2
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "An Agent tool upstream circuit has remained open"
      - alert: AgentChatQueueBacklog
        expr: insightops_agent_chat_queue_queued > 20
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Durable chat queue has more than 20 waiting runs"
      - alert: AgentChatQueueOldestWaitHigh
        expr: insightops_agent_chat_queue_oldest_queued_age_seconds > 30
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Oldest durable chat run has waited more than 30 seconds"
      - alert: AgentChatQueueExpiredLease
        expr: insightops_agent_chat_queue_expired_leases > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "A durable chat run lease is expired and awaiting takeover"
      - alert: AgentChatRecoveryStalled
        expr: increase(insightops_agent_chat_queue_reclaimed_total[10m]) - increase(insightops_agent_chat_queue_recovered_total[10m]) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "A reclaimed durable chat run has not restored its safe point"
      - alert: AgentChatReclaimLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(insightops_agent_chat_queue_reclaim_delay_seconds_bucket[10m]))) > 30
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Durable chat reclaim p95 delay is above 30 seconds"
      - alert: AgentChatLeaseLostBurst
        expr: increase(insightops_agent_chat_queue_lease_lost_total[10m]) > 3
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "More than three durable chat workers lost their lease in ten minutes"
      - alert: AgentChatDispatchErrors
        expr: increase(insightops_agent_chat_queue_dispatch_errors_total[10m]) > 3
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Durable chat executor rejected more than three dispatches"
      - alert: AgentChatSloSnapshotErrors
        expr: increase(insightops_agent_chat_queue_snapshot_errors_total[10m]) > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Durable chat queue SLO sampling is failing"
