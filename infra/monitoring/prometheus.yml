global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: insightops-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [server:18080]

  - job_name: insightops-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [worker:18081]
