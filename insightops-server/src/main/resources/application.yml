spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: insightops-server
  servlet:
    multipart:
      max-file-size: ${KNOWLEDGE_UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${KNOWLEDGE_UPLOAD_MAX_REQUEST_SIZE:22MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/insightops}
    username: ${DB_USERNAME:insightops}
    password: ${DB_PASSWORD:insightops_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    test-connection: false
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLED:false}
            required: ${SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${SMTP_READ_TIMEOUT_MS:10000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
    ollama:
      base-url: ${EMBEDDING_BASE_URL:http://127.0.0.1:11434}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:bge-m3}
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}
          temperature: ${DEEPSEEK_TEMPERATURE:0.2}
          max-tokens: ${DEEPSEEK_MAX_OUTPUT_TOKENS:4096}
          timeout: ${MODEL_RUN_TIMEOUT_SECONDS:90}s
          max-retries: ${MODEL_MAX_RETRIES:2}

insightops:
  agent:
    orchestration:
      enabled: ${AGENT_ORCHESTRATION_ENABLED:true}
      max-nodes: ${AGENT_ORCHESTRATION_MAX_NODES:12}
      max-parallelism: ${AGENT_ORCHESTRATION_MAX_PARALLELISM:3}
      max-model-tokens: ${AGENT_ORCHESTRATION_MAX_MODEL_TOKENS:16000}
      max-estimated-cost-cny: ${AGENT_ORCHESTRATION_MAX_ESTIMATED_COST_CNY:0.500000}
    cost-governance:
      enabled: ${AGENT_COST_GOVERNANCE_ENABLED:true}
      daily-token-limit: ${AGENT_COST_DAILY_TOKEN_LIMIT:500000}
      daily-cost-limit-cny: ${AGENT_COST_DAILY_COST_LIMIT_CNY:20.000000}
      monthly-token-limit: ${AGENT_COST_MONTHLY_TOKEN_LIMIT:10000000}
      monthly-cost-limit-cny: ${AGENT_COST_MONTHLY_COST_LIMIT_CNY:300.000000}
      max-concurrent-runs: ${AGENT_COST_MAX_CONCURRENT_RUNS:5}
      warning-percent: ${AGENT_COST_WARNING_PERCENT:80}
      hard-limit-enabled: ${AGENT_COST_HARD_LIMIT_ENABLED:true}
      timezone: ${AGENT_COST_TIMEZONE:Asia/Shanghai}
    evaluation-queue:
      enabled: ${AGENT_EVALUATION_QUEUE_ENABLED:true}
      concurrency: ${AGENT_EVALUATION_QUEUE_CONCURRENCY:1}
      poll-interval-ms: ${AGENT_EVALUATION_QUEUE_POLL_INTERVAL_MS:2000}
      initial-delay-ms: ${AGENT_EVALUATION_QUEUE_INITIAL_DELAY_MS:1000}
      lease-seconds: ${AGENT_EVALUATION_QUEUE_LEASE_SECONDS:180}
      heartbeat-seconds: ${AGENT_EVALUATION_QUEUE_HEARTBEAT_SECONDS:30}
      max-attempts: ${AGENT_EVALUATION_QUEUE_MAX_ATTEMPTS:3}
    chat-queue:
      enabled: ${AGENT_CHAT_QUEUE_ENABLED:true}
      concurrency: ${AGENT_CHAT_QUEUE_CONCURRENCY:2}
      poll-interval-ms: ${AGENT_CHAT_QUEUE_POLL_INTERVAL_MS:500}
      initial-delay-ms: ${AGENT_CHAT_QUEUE_INITIAL_DELAY_MS:1000}
      lease-seconds: ${AGENT_CHAT_QUEUE_LEASE_SECONDS:30}
      heartbeat-seconds: ${AGENT_CHAT_QUEUE_HEARTBEAT_SECONDS:5}
      max-attempts: ${AGENT_CHAT_QUEUE_MAX_ATTEMPTS:3}
      event-poll-ms: ${AGENT_CHAT_QUEUE_EVENT_POLL_MS:200}
      stream-heartbeat-ms: ${AGENT_CHAT_STREAM_HEARTBEAT_MS:5000}
      run-timeout-seconds: ${AGENT_CHAT_QUEUE_RUN_TIMEOUT_SECONDS:${AGENT_RUN_TIMEOUT_SECONDS:90}}
      snapshot-interval-ms: ${AGENT_CHAT_QUEUE_SNAPSHOT_INTERVAL_MS:15000}
  report:
    pdf-font-path: ${REPORT_PDF_FONT_PATH:}
  knowledge:
    upload:
      directory: ${KNOWLEDGE_UPLOAD_DIRECTORY:./data/knowledge-uploads}
      max-file-bytes: ${KNOWLEDGE_UPLOAD_MAX_FILE_BYTES:20971520}
      workspace-quota-bytes: ${KNOWLEDGE_UPLOAD_WORKSPACE_QUOTA_BYTES:1073741824}
      max-pdf-pages: ${KNOWLEDGE_UPLOAD_MAX_PDF_PAGES:500}
      max-extracted-characters: ${KNOWLEDGE_UPLOAD_MAX_EXTRACTED_CHARACTERS:2000000}
    embedding:
      enabled: ${EMBEDDING_ENABLED:false}
      provider: ${EMBEDDING_PROVIDER:ollama}
      model: ${EMBEDDING_MODEL:bge-m3}
      dimensions: ${EMBEDDING_DIMENSIONS:1024}
      minimum-score: ${EMBEDDING_MINIMUM_SCORE:0.35}
    rag:
      enabled: ${RAG_ENABLED:false}
      candidate-limit: ${RAG_CANDIDATE_LIMIT:12}
      max-evidence-chunks: ${RAG_MAX_EVIDENCE_CHUNKS:6}
      max-chunks-per-document: ${RAG_MAX_CHUNKS_PER_DOCUMENT:2}
      max-context-characters: ${RAG_MAX_CONTEXT_CHARACTERS:12000}
    evaluation:
      minimum-recall-at-k: ${RAG_EVAL_MIN_RECALL_AT_K:0.90}
      minimum-mrr: ${RAG_EVAL_MIN_MRR:0.65}
      minimum-term-coverage: ${RAG_EVAL_MIN_TERM_COVERAGE:0.55}
      minimum-no-answer-accuracy: ${RAG_EVAL_MIN_NO_ANSWER_ACCURACY:1.0}
      minimum-citation-precision: ${RAG_EVAL_MIN_CITATION_PRECISION:0.90}
      minimum-citation-coverage: ${RAG_EVAL_MIN_CITATION_COVERAGE:0.50}
      minimum-faithfulness: ${RAG_EVAL_MIN_FAITHFULNESS:0.75}
  auth:
    session-days: ${AUTH_SESSION_DAYS:14}
    secure-cookie: ${AUTH_SECURE_COOKIE:false}
    login-max-failures: ${AUTH_LOGIN_MAX_FAILURES:5}
    login-window-minutes: ${AUTH_LOGIN_WINDOW_MINUTES:15}
    login-lock-minutes: ${AUTH_LOGIN_LOCK_MINUTES:15}
    bootstrap:
      enabled: ${AUTH_BOOTSTRAP_ENABLED:false}
      username: ${AUTH_BOOTSTRAP_USERNAME:alpha-owner}
      display-name: ${AUTH_BOOTSTRAP_DISPLAY_NAME:Alpha Owner}
      password: ${AUTH_BOOTSTRAP_PASSWORD:}
  identity:
    enabled: ${IDENTITY_ENABLED:true}
    public-base-url: ${APP_PUBLIC_URL:http://localhost:5173}
    encryption-key: ${IDENTITY_ENCRYPTION_KEY:${DELIVERY_ENCRYPTION_KEY:${DB_PASSWORD:insightops_dev}}}
    email-verification-minutes: ${IDENTITY_EMAIL_VERIFICATION_MINUTES:60}
    password-reset-minutes: ${IDENTITY_PASSWORD_RESET_MINUTES:30}
    invitation-hours: ${IDENTITY_INVITATION_HOURS:72}
    deletion-grace-days: ${IDENTITY_DELETION_GRACE_DAYS:7}
    deletion-initial-delay-ms: ${IDENTITY_DELETION_INITIAL_DELAY_MS:60000}
    deletion-poll-delay-ms: ${IDENTITY_DELETION_POLL_DELAY_MS:3600000}
    mail:
      enabled: ${IDENTITY_MAIL_ENABLED:false}
      from: ${IDENTITY_MAIL_FROM:noreply@localhost}
      batch-size: ${IDENTITY_MAIL_BATCH_SIZE:10}
      lease-seconds: ${IDENTITY_MAIL_LEASE_SECONDS:120}
      initial-delay-ms: ${IDENTITY_MAIL_INITIAL_DELAY_MS:20000}
      poll-delay-ms: ${IDENTITY_MAIL_POLL_DELAY_MS:15000}
  delivery:
    public-base-url: ${APP_PUBLIC_URL:https://insightops.canghaior.com}
    request-timeout-seconds: ${REPORT_DELIVERY_TIMEOUT_SECONDS:20}
    encryption-key: ${DELIVERY_ENCRYPTION_KEY:${DB_PASSWORD:insightops_dev}}
  tool:
    resilience:
      enabled: ${AGENT_TOOL_RESILIENCE_ENABLED:true}
      max-attempts: ${AGENT_TOOL_MAX_ATTEMPTS:3}
      max-total-attempts: ${AGENT_RUN_MAX_TOOL_ATTEMPTS:8}
      run-timeout-seconds: ${AGENT_RUN_TIMEOUT_SECONDS:90}
      max-tool-duration-seconds: ${AGENT_RUN_MAX_TOOL_DURATION_SECONDS:60}
      initial-backoff-ms: ${AGENT_TOOL_RETRY_INITIAL_DELAY_MS:250}
      max-backoff-ms: ${AGENT_TOOL_RETRY_MAX_DELAY_MS:2000}
      poll-interval-ms: ${AGENT_TOOL_POLL_INTERVAL_MS:100}
      circuit-window-size: ${AGENT_TOOL_CIRCUIT_WINDOW_SIZE:10}
      circuit-minimum-calls: ${AGENT_TOOL_CIRCUIT_MINIMUM_CALLS:5}
      circuit-failure-rate-percent: ${AGENT_TOOL_CIRCUIT_FAILURE_RATE_PERCENT:50}
      circuit-open-seconds: ${AGENT_TOOL_CIRCUIT_OPEN_SECONDS:30}
      circuit-half-open-permits: ${AGENT_TOOL_CIRCUIT_HALF_OPEN_PERMITS:2}
    github:
      base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
      token: ${GITHUB_TOKEN:}
      api-version: ${GITHUB_API_VERSION:2026-03-10}
      connect-timeout-seconds: ${GITHUB_CONNECT_TIMEOUT_SECONDS:10}
      request-timeout-seconds: ${GITHUB_REQUEST_TIMEOUT_SECONDS:20}
      max-body-chars: ${GITHUB_RELEASE_MAX_BODY_CHARS:1600}
  model:
    deepseek:
      enabled: ${DEEPSEEK_ENABLED:false}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}
      thinking-enabled: ${DEEPSEEK_THINKING_ENABLED:false}
      temperature: ${DEEPSEEK_TEMPERATURE:0.2}
      max-output-tokens: ${DEEPSEEK_MAX_OUTPUT_TOKENS:4096}
      max-tool-rounds: ${MODEL_MAX_TOOL_ROUNDS:4}
      request-timeout-seconds: ${MODEL_RUN_TIMEOUT_SECONDS:90}
      max-retries: ${MODEL_MAX_RETRIES:2}
      smoke-test-enabled: ${DEEPSEEK_SMOKE_TEST_ENABLED:false}
      pricing:
        effective-date: ${DEEPSEEK_PRICING_EFFECTIVE_DATE:2026-08-16}
        usd-to-cny: ${DEEPSEEK_PRICING_USD_TO_CNY:7.20}
        input-cache-hit-usd-per-million: ${DEEPSEEK_INPUT_CACHE_HIT_USD_PER_MILLION:0.0028}
        input-cache-miss-usd-per-million: ${DEEPSEEK_INPUT_CACHE_MISS_USD_PER_MILLION:0.14}
        output-usd-per-million: ${DEEPSEEK_OUTPUT_USD_PER_MILLION:0.28}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18080}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
