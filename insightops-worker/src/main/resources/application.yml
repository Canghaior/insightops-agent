spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: insightops-worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/insightops}
    username: ${DB_USERNAME:insightops}
    password: ${DB_PASSWORD:insightops_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
    ollama:
      base-url: ${EMBEDDING_BASE_URL:http://127.0.0.1:11434}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:bge-m3}
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}
          temperature: ${DEEPSEEK_TEMPERATURE:0.2}
          max-tokens: ${DEEPSEEK_MAX_OUTPUT_TOKENS:4096}
          timeout: ${MODEL_RUN_TIMEOUT_SECONDS:90}s
          max-retries: ${MODEL_MAX_RETRIES:2}

insightops:
  collection:
    enabled: ${RELEASE_COLLECTION_ENABLED:true}
    batch-size: ${RELEASE_COLLECTION_BATCH_SIZE:3}
    sync-interval-hours: ${RELEASE_COLLECTION_INTERVAL_HOURS:6}
    lock-minutes: ${RELEASE_COLLECTION_LOCK_MINUTES:5}
    initial-delay-ms: ${RELEASE_COLLECTION_INITIAL_DELAY_MS:3000}
    poll-delay-ms: ${RELEASE_COLLECTION_POLL_DELAY_MS:30000}
  intelligence:
    enabled: ${INTELLIGENCE_ANALYSIS_ENABLED:true}
    daily-limit: ${INTELLIGENCE_ANALYSIS_DAILY_LIMIT:5}
    batch-size: ${INTELLIGENCE_ANALYSIS_BATCH_SIZE:2}
    lock-minutes: ${INTELLIGENCE_ANALYSIS_LOCK_MINUTES:5}
    max-retries: ${INTELLIGENCE_ANALYSIS_MAX_RETRIES:2}
    max-output-tokens: ${INTELLIGENCE_ANALYSIS_MAX_OUTPUT_TOKENS:1600}
    initial-delay-ms: ${INTELLIGENCE_ANALYSIS_INITIAL_DELAY_MS:10000}
    poll-delay-ms: ${INTELLIGENCE_ANALYSIS_POLL_DELAY_MS:30000}
    digest-initial-delay-ms: ${INTELLIGENCE_DIGEST_INITIAL_DELAY_MS:15000}
    digest-poll-delay-ms: ${INTELLIGENCE_DIGEST_POLL_DELAY_MS:300000}
  delivery:
    enabled: ${REPORT_DELIVERY_ENABLED:true}
    batch-size: ${REPORT_DELIVERY_BATCH_SIZE:5}
    lease-minutes: ${REPORT_DELIVERY_LEASE_MINUTES:2}
    max-retries: ${REPORT_DELIVERY_MAX_RETRIES:2}
    request-timeout-seconds: ${REPORT_DELIVERY_TIMEOUT_SECONDS:20}
    initial-delay-ms: ${REPORT_DELIVERY_INITIAL_DELAY_MS:20000}
    poll-delay-ms: ${REPORT_DELIVERY_POLL_DELAY_MS:30000}
    public-base-url: ${APP_PUBLIC_URL:https://insightops.canghaior.com}
    encryption-key: ${DELIVERY_ENCRYPTION_KEY:${DB_PASSWORD:insightops_dev}}
  knowledge:
    embedding:
      enabled: ${EMBEDDING_ENABLED:false}
      provider: ${EMBEDDING_PROVIDER:ollama}
      model: ${EMBEDDING_MODEL:bge-m3}
      dimensions: ${EMBEDDING_DIMENSIONS:1024}
      batch-size: ${EMBEDDING_BATCH_SIZE:32}
      max-batches-per-cycle: ${EMBEDDING_MAX_BATCHES_PER_CYCLE:50}
      lock-minutes: ${EMBEDDING_LOCK_MINUTES:10}
      max-retries: ${EMBEDDING_MAX_RETRIES:3}
      retry-minutes: ${EMBEDDING_RETRY_MINUTES:2}
      initial-delay-ms: ${EMBEDDING_INITIAL_DELAY_MS:15000}
      poll-delay-ms: ${EMBEDDING_POLL_DELAY_MS:10000}
    collection:
      enabled: ${DOCUMENT_COLLECTION_ENABLED:false}
      batch-size: ${DOCUMENT_COLLECTION_BATCH_SIZE:1}
      sync-interval-hours: ${DOCUMENT_COLLECTION_INTERVAL_HOURS:24}
      lock-minutes: ${DOCUMENT_COLLECTION_LOCK_MINUTES:10}
      max-pages-per-source: ${DOCUMENT_CRAWL_MAX_PAGES_PER_SOURCE:200}
      max-depth: ${DOCUMENT_CRAWL_MAX_DEPTH:4}
      max-bytes-per-page: ${DOCUMENT_CRAWL_MAX_BYTES_PER_PAGE:8388608}
      request-timeout-seconds: ${DOCUMENT_CRAWL_REQUEST_TIMEOUT_SECONDS:20}
      request-delay-ms: ${DOCUMENT_CRAWL_REQUEST_DELAY_MS:500}
      chunk-max-tokens: ${DOCUMENT_CHUNK_MAX_TOKENS:600}
      chunk-overlap-tokens: ${DOCUMENT_CHUNK_OVERLAP_TOKENS:80}
      initial-delay-ms: ${DOCUMENT_COLLECTION_INITIAL_DELAY_MS:20000}
      poll-delay-ms: ${DOCUMENT_COLLECTION_POLL_DELAY_MS:60000}
  tool:
    github:
      base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
      token: ${GITHUB_TOKEN:}
      api-version: ${GITHUB_API_VERSION:2026-03-10}
      connect-timeout-seconds: ${GITHUB_CONNECT_TIMEOUT_SECONDS:10}
      request-timeout-seconds: ${GITHUB_REQUEST_TIMEOUT_SECONDS:20}
      max-body-chars: ${GITHUB_RELEASE_MAX_BODY_CHARS:1600}
  model:
    deepseek:
      enabled: ${DEEPSEEK_ENABLED:false}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}
      thinking-enabled: ${DEEPSEEK_THINKING_ENABLED:false}
      temperature: ${DEEPSEEK_TEMPERATURE:0.2}
      max-output-tokens: ${DEEPSEEK_MAX_OUTPUT_TOKENS:4096}
      max-tool-rounds: ${MODEL_MAX_TOOL_ROUNDS:4}
      request-timeout-seconds: ${MODEL_RUN_TIMEOUT_SECONDS:90}
      max-retries: ${MODEL_MAX_RETRIES:2}
      smoke-test-enabled: false
      pricing:
        effective-date: ${DEEPSEEK_PRICING_EFFECTIVE_DATE:2026-08-16}
        usd-to-cny: ${DEEPSEEK_PRICING_USD_TO_CNY:7.20}
        input-cache-hit-usd-per-million: ${DEEPSEEK_INPUT_CACHE_HIT_USD_PER_MILLION:0.0028}
        input-cache-miss-usd-per-million: ${DEEPSEEK_INPUT_CACHE_MISS_USD_PER_MILLION:0.14}
        output-usd-per-million: ${DEEPSEEK_OUTPUT_USD_PER_MILLION:0.28}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${WORKER_PORT:18081}
